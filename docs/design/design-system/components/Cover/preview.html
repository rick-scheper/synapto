<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synapto</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:496px; height:288px; }
  .accent { fill:var(--accent); }
  .deep { fill:var(--accent-deep); }
  .tint { fill:var(--accent-soft); stroke:var(--accent-deep); stroke-width:1; }
  .node { fill:var(--glow); }
  .cut { fill:var(--surface); }
  .blk { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:96px; line-height:.92; font-weight:600; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 496 288" width="496" height="288">
<!--
  blocks      accent 176x240 bled off the top (the signal teal, largest) - accent-deep 128x160 (the logo's deeper strands) - accent-soft 144x128 bleeding off the right, edged accent-deep so it holds on the dark ground - one glow node r=space-2 (the lit synapse)
  arrangement one tall accent slab with satellites stepping down to the right, space-4 gutters, bottoms on a falling line like the logo's strands
  pattern     dot grid cut into the accent slab in surface, from "precise, technical, a 4px grid": r=2 dots at a space-5 (24px) pitch, 48 units
  scales      sides in space-4 multiples; gutters space-4; pitch space-5; corners radius-lg; node radius-full
-->
