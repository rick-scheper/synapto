</head>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>

.t-light{--surface:#f5f7f8;--surface-raised:#ffffff;--surface-sunken:#ecf0f3;--line:#d9e0e5;--line-strong:#77889a;--ink:#14202a;--ink-muted:#4f5e6b;--accent:#08757d;--accent-soft:#d9f4f2;--on-accent:#ffffff;--glow:#5afef5;--accent-deep:#177285;--success:#1b7448;--success-soft:#dcf3e6;--warning:#8a5600;--warning-soft:#fbefd5;--danger:#b8283a;--danger-soft:#fbe2e4;--code-keyword:#a8401a;--code-string:#2a6f37;--code-number:#8a5600;--code-function:#08757d;--code-comment:#5d6a76;--link:#08757d;--focus:#08757d;--shadow-raised:0 1px 2px rgba(20,32,42,0.06), 0 4px 16px rgba(20,32,42,0.06);--shadow-glow:0 0 0 1px rgba(8,117,125,0.45), 0 0 14px rgba(8,117,125,0.18);--shadow-focus:0 0 0 2px #ffffff, 0 0 0 4px #08757d;}

.sy-lesson{width:auto;height:100%}

</style>
</helmet>
<div class="{{themeClass}}" style="min-height: 1180px; background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 26px">

<header style="height: 56px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: center; padding: 0 32px">
<div style="width: 100%; max-width: 1280px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap">
<a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink)">
<img src="/_blob/60a25a56ca464905442a65578a30f911" alt="" style="width: 28px; height: 28px; border-radius: 6px">
<span style="font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: 0.02em">Synapto</span>
</a>
<nav style="display: flex; gap: 4px">
<a href="#" style="font-size: 13px; font-weight: 500; color: var(--ink); text-decoration: none; padding: 6px 12px; border-radius: 8px; background: var(--surface-raised)">Lessons</a>
<a href="#" style="font-size: 13px; font-weight: 500; color: var(--ink-muted); text-decoration: none; padding: 6px 12px; border-radius: 8px">Progress</a>
</nav>
<div style="flex-grow: 1"></div>
<label style="position: relative; display: flex; align-items: center">
<span style="position: absolute; left: 10px; color: var(--ink-muted); display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>
<input aria-label="Search lessons" placeholder="Search lessons and concepts" style="width: 280px; height: 32px; box-sizing: border-box; padding: 0 12px 0 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-sunken); color: var(--ink); font-family: var(--font-sans); font-size: 13px">
</label>
<button type="button" aria-label="Toggle light and dark theme" style="width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-muted); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
</div>
</header>

<main style="max-width: 1280px; margin: 0 auto; padding: 48px 32px 64px; display: flex; flex-direction: column; gap: 40px">

<section style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-family: var(--font-display); font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted)">Library</div>
<h1 style="margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 40px; font-weight: 600">Lessons</h1>
<p style="margin: 0; font-size: 14px; line-height: 22px; color: var(--ink-muted)">6 lessons across 2 repos · 3 in progress · 1 stale</p>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
<span style="font-size: 13px; color: var(--ink-muted); margin-right: 4px">Concept</span>
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</section>

<section aria-label="Continue" style="background: var(--surface-raised); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap">
<x-import component-from-global-scope="Synapto.ProgressRing" value="{{continueProgress}}" size="{{ringSize}}" stroke="{{ringStroke}}"></x-import>
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="font-family: var(--font-display); font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted)">Continue where you left off</div>
<div style="font-family: var(--font-display); font-size: 20px; line-height: 28px; font-weight: 600">Voxel downsampling with an octree</div>
<div style="font-size: 14px; line-height: 22px; color: var(--ink-muted)">Next: Quiz · 4 of 7 answered · Rebuild 1 of 2 passed</div>
</div>
<a href="Notebook.dc.html" style="height: 36px; padding: 0 16px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px">Continue lesson <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</section>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px">
<h2 style="margin: 0; font-family: var(--font-display); font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink)">{{g.repo}}</h2>
<span style="font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted)">{{g.path}}</span>
<span style="flex-grow: 1"></span>
<span style="font-size: 12px; color: var(--ink-muted)">{{g.count}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px">
<sc-for list="{{g.lessons}}" as="l" hint-placeholder-count="3">
<x-import component-from-global-scope="Synapto.LessonCard" title="{{l.title}}" summary="{{l.summary}}" date="{{l.date}}" difficulty="{{l.difficulty}}" concepts="{{l.concepts}}" progress="{{l.progress}}" stale="{{l.stale}}" repo="{{l.branch}}"></x-import>
</sc-for>
</div>
</section>
</sc-for>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    var on = (this.state && this.state.concept) || 'All';
    var names = ['All', 'spatial indexing', 'numpy', 'async', 'testing'];
    var self = this;
    var base = 'height: 28px; padding: 0 12px; border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; ';
    var chips = names.map(function (n) {
      var sel = n === on;
      return { label: n, on: sel, pick: function () { self.setState({ concept: n }); },
        style: base + (sel ? 'background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent)' : 'background: transparent; color: var(--ink-muted); border: 1px solid var(--line-strong)') };
    });
    return {
      themeClass: this.props.theme === 'light' ? 't-light' : 't-dark',
      chips: chips,
      continueProgress: 0.6, ringSize: 56, ringStroke: 5,
      groups: [
        { repo: 'pointtools', path: '~/code/pointtools', count: '3 lessons', lessons: [
          { title: 'Voxel downsampling with an octree', summary: 'How downsample() bins points into voxels with integer floor division and averages each cell in one vectorised pass.', date: '3 Oct 2026', difficulty: 'Intermediate', concepts: ['spatial hashing', 'numpy'], progress: 0.6, stale: false, branch: 'feat/downsample · e4f5a6b' },
          { title: 'Chunked LAZ reader', summary: 'Streaming large point clouds in fixed-size chunks so memory stays flat regardless of file size.', date: '29 Sep 2026', difficulty: 'Easy', concepts: ['generators', 'io'], progress: 1, stale: false, branch: 'main · 91c0d2e' },

        ]},
        { repo: 'webhooks-api', path: '~/code/webhooks-api', count: '3 lessons', lessons: [
          { title: 'Retry with exponential backoff', summary: 'A decorator that retries flaky outbound calls with jittered, capped delays.', date: '27 Sep 2026', difficulty: 'Easy', concepts: ['decorators', 'async'], progress: 1, stale: false, branch: 'main · 0d3e9aa' },
          { title: 'Idempotent webhook delivery', summary: 'Deduplicating deliveries with an idempotency key table and a unique constraint instead of locks.', date: '22 Sep 2026', difficulty: 'Intermediate', concepts: ['databases', 'testing'], progress: 0.3, stale: false, branch: 'feat/idempotency · 7f21c6b' },
          { title: 'Signature verification middleware', summary: 'Verifying HMAC signatures in constant time before a request reaches the handlers.', date: '18 Sep 2026', difficulty: 'Easy', concepts: ['security', 'async'], progress: 0.15, stale: false, branch: 'main · c55e0f3' }
        ]}
      ]
    };
  }
}
</script>
